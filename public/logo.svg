<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Heart with cross icon -->
  <g transform="translate(0, 8)">
    <!-- Heart shape -->
    <path d="M32 56 C32 56 8 40 8 24 C8 14 16 6 24 6 C28 6 32 10 32 14 C32 10 36 6 40 6 C48 6 56 14 56 24 C56 40 32 56 32 56Z" fill="#0A4D8C"/>
    <!-- Medical cross on heart -->
    <rect x="27" y="18" width="10" height="24" rx="2" fill="white"/>
    <rect x="22" y="24" width="20" height="10" rx="2" fill="white"/>
    <!-- Road/path below heart -->
    <path d="M20 52 L32 64 L44 52" stroke="#2BB673" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Text -->
  <text x="68" y="36" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="700" fill="#0A4D8C">Care Ride</text>
  <text x="68" y="58" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7280" letter-spacing="1.5">TRANSPORTATION</text>
  <!-- Tagline -->
  <text x="68" y="74" font-family="Inter, Arial, sans-serif" font-size="10" fill="#2BB673" font-weight="600">Safe Rides. Trusted Care.</text>
</svg>
